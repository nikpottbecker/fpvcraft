name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: input
    id: mc
    attributes:
      label: Minecraft and loader version
      placeholder: 1.21.1, NeoForge 21.1.x
    validations:
      required: true
  - type: input
    id: mod
    attributes:
      label: FPVCraft version
      placeholder: 0.2.0
    validations:
      required: true
  - type: input
    id: controller
    attributes:
      label: Transmitter / controller
      placeholder: Radiomaster Pocket via USB (EdgeTX joystick)
  - type: textarea
    id: steps
    attributes:
      label: What happened and how to reproduce it
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log or crash report
      description: Link to latest.log or crash report (mclo.gs or gist).
